apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: user-postgres-statefulset
  namespace: authify
spec:
  # DNS: <pod-name>.<service-name>.<namespace>.svc.cluster.local
  serviceName: user-headless-service # user-postgres-0.user-headless-service.default.svc.cluster.local
  replicas: 1
  selector:
    matchLabels:
      authify: user-postgres
  template:
    metadata:
      labels:
        authify: user-postgres
    spec:
      containers:
        - name: postgres
          image: postgres:14.2
          env:
            - name: POSTGRES_DB
              value: authify_users_db
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: user-secret
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: user-secret
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_HOST
              valueFrom:
                secretKeyRef:
                  name: user-secret
                  key: POSTGRES_HOST
          ports:
            - containerPort: 5432
              name: postgres
          volumeMounts:
            - name: postgres-user-data
              mountPath: /var/lib/postgresql/data
              subPath: postgres # specific to postgres
          livenessProbe:
            tcpSocket:
              port: 5432
            initialDelaySeconds: 60
            periodSeconds: 30
            failureThreshold: 3
          readinessProbe:
            tcpSocket:
              port: 5432
            initialDelaySeconds: 60
            periodSeconds: 30
            failureThreshold: 3
  volumeClaimTemplates:
    - metadata:
        name: postgres-user-data
      spec:
        # "ReadWriteOnce" means only 1 Pod can read and write to the volume at a time.
        accessModes:
          - 'ReadWriteOnce'
        resources:
          requests:
            storage: 500Mi # 500 MB
        # PVC will look for PVs with the same storageClassName to bind to
        storageClassName: authify-storage-class
