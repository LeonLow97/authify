apiVersion: v1
kind: Service
metadata:
  name: user-headless-service
  namespace: authify
  labels:
    authify: user
spec:
  # `clusterIP: None` ensures that the service does not get assigned an IP address, which is important
  # for StatefulSet as it allows Pods to be accessed using their stable DNS names
  clusterIP: None # headless service
  selector:
    authify: user-postgres
  ports:
    - name: user-postgres-h
      port: 5432
      targetPort: 5432
